services:
  - type: web
    name: moorex-ai
    runtime: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: AI_TIMEOUT_MS
        value: 20000
